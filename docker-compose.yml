# Reproducible local PostgreSQL for reviewers.
#
# NOTE ON PORTS: this service binds host port 5433 so it never collides with a
# PostgreSQL already running on the default 5432 (for example a Homebrew
# install). To use it:
#
#     docker compose up -d db
#     export DATABASE_URL=postgresql+asyncpg://newtonite:newtonite_dev_pw@127.0.0.1:5433/newtonite
#     export TEST_DATABASE_URL=postgresql+asyncpg://newtonite:newtonite_dev_pw@127.0.0.1:5433/newtonite_test
#
# The credentials here are local-development placeholders, not secrets.

services:
  db:
    image: postgres:16-alpine
    container_name: newtonite-db
    environment:
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: newtonite_dev_pw
      POSTGRES_DB: newtonite
    ports:
      - "5433:5432"
    volumes:
      - newtonite_pgdata:/var/lib/postgresql/data
      # Creates the additional test database on first start.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  newtonite_pgdata:

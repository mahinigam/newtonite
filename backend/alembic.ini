[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# `sqlalchemy.url` is deliberately left blank. `alembic/env.py` resolves the URL
# from application settings (.env / environment variables), or uses a URL that
# the caller sets programmatically - which is how the test suite points
# migrations at the throwaway test database.
sqlalchemy.url =
# Timestamped, readable revision file names.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
